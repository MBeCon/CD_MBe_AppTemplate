# Verbindliche QS-Ebene: Diese Jobs müssen grün sein, bevor ein Merge Request nach main
# gemergt werden darf ("Pipelines must succeed", siehe scripts/setup-gitlab.sh).
# Deployment läuft nur nach einem Merge auf main und nur, wenn alle Jobs grün sind.

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Keine doppelten Pipelines für Branches mit offenem Merge Request
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
  auto_cancel:
    on_new_commit: interruptible

stages: [check, scan, deploy]

variables:
  # Images exakt gepinnt; Renovate (renovate.json) schlägt Updates per Merge Request vor.
  PYTHON_IMAGE: "python:3.13-slim"
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"
  TRIVY_IMAGE: "aquasec/trivy:0.76.1"
  HADOLINT_IMAGE: "hadolint/hadolint:v2.15.1"
  DOCKER_IMAGE: "docker:28.5"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

default:
  interruptible: true

.python:
  image: $PYTHON_IMAGE
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
  before_script:
    - pip install -r requirements-dev.txt

lint:
  extends: .python
  stage: check
  script:
    # Code-Quality-Bericht für das Merge-Request-Widget, danach lesbare Ausgabe als Gate
    - ruff check --output-format=gitlab --output-file=gl-code-quality-report.json . || true
    - ruff check .
    - ruff format --check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  extends: .python
  stage: check
  script:
    # pytest mit Mindest-Coverage (siehe pyproject.toml)
    - pytest --junitxml=report.xml --cov-report=xml
  coverage: '/TOTAL.*\s+(\d+(?:\.\d+)?%)/'
  artifacts:
    when: always
    reports:
      junit: report.xml
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml

security:
  extends: .python
  stage: check
  script:
    - bandit -c pyproject.toml -r app             # Sicherheitsanalyse Code
    - pip-audit -r requirements.txt --strict      # bekannte Schwachstellen in Abhängigkeiten

secrets:
  stage: check
  image:
    name: $GITLEAKS_IMAGE
    entrypoint: [""]
  variables:
    GIT_DEPTH: 0  # gesamte Historie scannen
  script:
    - gitleaks git --redact --verbose .

docker:
  stage: check
  image: $DOCKER_IMAGE
  services:
    - name: "docker:28.5-dind"
      alias: docker
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    # hadolint (Dockerfile-Prüfung)
    - docker run --rm -i "$HADOLINT_IMAGE" < Dockerfile
    - docker build -t "app:${CI_COMMIT_SHA}" .
    # Smoke-Test: Container startet, /health antwortet (Port liegt auf dem dind-Dienst "docker")
    - docker run -d --name smoke -p 8000:8000 -e SECRET_KEY=ci-smoke-test -e APP_ENV=ci "app:${CI_COMMIT_SHA}"
    - |
      for _ in $(seq 1 20); do
        if wget -qO- http://docker:8000/health; then echo; ok=1; break; fi
        sleep 1
      done
      if [ -z "${ok:-}" ]; then docker logs smoke; exit 1; fi
    - docker save "app:${CI_COMMIT_SHA}" -o image.tar
  artifacts:
    paths: [image.tar]
    expire_in: 1 hour

docker-scan:
  stage: scan
  needs: [docker]
  image:
    name: $TRIVY_IMAGE
    entrypoint: [""]
  script:
    # Trivy (Schwachstellen im Image)
    - trivy image --input image.tar --exit-code 1 --severity HIGH,CRITICAL --ignore-unfixed --no-progress

deploy:
  stage: deploy
  image: $DOCKER_IMAGE
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $CI_PIPELINE_SOURCE == "push"
  # GitLab-Environment "production": dort CI/CD-Variablen (Secrets) hinterlegen und optional
  # als "Protected environment" mit manueller Freigabe schützen.
  environment:
    name: production
  interruptible: false
  script:
    # Deployment (PLATZHALTER – durch euren bestehenden Schritt ersetzen)
    - echo "Hier den bestehenden Deployment-Schritt einsetzen."
    - echo "Empfehlung - Image mit Tag ${CI_COMMIT_SHA} bauen/veröffentlichen (z. B. in die GitLab Container Registry),"
    - echo "damit jede Version eindeutig zuordenbar und ein Rollback möglich ist."
    - echo "Secrets nur über geschützte, maskierte CI/CD-Variablen, nie im Repo oder Image."
