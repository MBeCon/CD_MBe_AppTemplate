[project]
name = "CD_te_app"
version = "0.1.0"
description = "te interne Anwendung (aus CD_te_app_template)"
requires-python = ">=3.13"

# --- Linting & Formatierung -------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # Import-Sortierung
  "B",        # bugbear (typische Fehler)
  "UP",       # moderne Python-Syntax
  "S",        # Sicherheitsregeln (bandit)
  "SIM",      # Vereinfachungen
  "C4",       # Comprehensions
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # assert ist in Tests erlaubt

# --- Tests & Coverage -------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=70"

[tool.coverage.run]
branch = true

# --- Security-Scan ----------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv"]
