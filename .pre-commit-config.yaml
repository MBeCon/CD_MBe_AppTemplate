# Lokale QS-Ebene: schnelles Feedback vor Commit und Push.
# Einmalig pro Klon:  pre-commit install
# Manuell alles prüfen: pre-commit run --all-files
# Die verbindliche Prüfung passiert zusätzlich in der GitLab-Pipeline.

default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: ["--fix"]
      - id: ruff-format

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]

  # Tests laufen vor dem Push (nicht bei jedem Commit), benötigt aktive .venv
  - repo: local
    hooks:
      - id: pytest
        name: pytest (vor Push)
        entry: python -m pytest -q
        language: system
        pass_filenames: false
        stages: [pre-push]
